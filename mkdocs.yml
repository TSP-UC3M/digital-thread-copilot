site_name: digital-thread-copilot
site_url: https://tsp-uc3m.github.io/digital-thread-copilot/
site_description: Generative AI copilot for the digital thread
repo_url: https://github.com/TSP-UC3M/digital-thread-copilot
theme:
  name: material
  language: en
  features:
    - navigation.sections
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Light mode
plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: fr
          name: Français
          build: true
          nav_translations:
            Home: Accueil
            Problem statement: Énoncé du problème
            State of the art: État de l'art
            AI usage: Usage de l'IA
            Decisions: Décisions
            Architecture: Architecture
            Evaluation protocol: Protocole d'évaluation
            Quality: Qualité
        - locale: es
          name: Español
          build: true
          nav_translations:
            Home: Inicio
            Problem statement: Planteamiento
            State of the art: Estado de la cuestión
            AI usage: Uso de la IA
            Decisions: Decisiones
            Architecture: Arquitectura
            Evaluation protocol: Protocolo de evaluación
            Quality: Calidad
markdown_extensions:
  - tables
  - admonition
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Home: index.md
  - Problem statement: 00-planteamiento.md
  - State of the art: 01-state-of-the-art.md
  - AI usage: ai-usage.md
  - Decisions: adr/index.md
  - Architecture: 02-architecture.md
  - Evaluation protocol: evaluation-protocol.md
  - Quality: quality.md
