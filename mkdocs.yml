site_name: digital-thread-copilot
site_url: https://tsp-uc3m.github.io/digital-thread-copilot/
site_description: Generative AI copilot for the digital thread
repo_url: https://github.com/TSP-UC3M/digital-thread-copilot
theme:
  name: material
  language: en
  features:
    - navigation.sections
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Light mode
plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: fr
          name: Français
          build: true
          nav_translations:
            Home: Accueil
            Problem statement: Énoncé du problème
            State of the art: État de l'art
            AI usage: Usage de l'IA
            Requirements: Exigences
            Design: Conception
            Architecture: Architecture
            Decisions: Décisions
            Ontology: Ontologie
            Guides: Guides
            User guide: Guide d'utilisation
            Operations guide: Guide d'exploitation
            Evaluation: Évaluation
            Evaluation protocol: Protocole d'évaluation
            Results: Résultats
            Verification: Vérification
            Traceability: Traçabilité
            Quality: Qualité
            Project: Projet
            Process: Processus
            Team: Équipe
            Defense plan: Plan de soutenance
        - locale: es
          name: Español
          build: true
          nav_translations:
            Home: Inicio
            Problem statement: Planteamiento
            State of the art: Estado de la cuestión
            AI usage: Uso de la IA
            Requirements: Requisitos
            Design: Diseño
            Architecture: Arquitectura
            Decisions: Decisiones
            Ontology: Ontología
            Guides: Guías
            User guide: Guía de uso
            Operations guide: Guía de operación
            Evaluation: Evaluación
            Evaluation protocol: Protocolo de evaluación
            Results: Resultados
            Verification: Verificación
            Traceability: Trazabilidad
            Quality: Calidad
            Project: Proyecto
            Process: Proceso
            Team: Equipo
            Defense plan: Plan de la defensa
markdown_extensions:
  - tables
  - admonition
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Home: index.md
  - Problem statement: 00-planteamiento.md
  - State of the art: 01-state-of-the-art.md
  - Requirements: 03-requirements.md
  - Design:
      - Architecture: 02-architecture.md
      - Decisions: adr/index.md
      - Ontology: 04-ontology.md
  - Guides:
      - User guide: user-guide.md
      - Operations guide: operations.md
  - Evaluation:
      - Evaluation protocol: evaluation-protocol.md
      - Results: 05-evaluation.md
  - Verification:
      - Traceability: traceability.md
      - Quality: quality.md
  - Project:
      - Process: process/index.md
      - Sprint 1: process/sprint-1.md
      - Team: team.md
      - Defense plan: defense/slide-plan.md
      - AI usage: ai-usage.md
