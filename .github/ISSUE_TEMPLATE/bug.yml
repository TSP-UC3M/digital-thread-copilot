name: Defect
description: Something does not behave as specified
labels: ["type:bug"]
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed
      description: What happens, with the command or the page and the full output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: What should happen, with the requirement or the document that says so.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
    validations:
      required: true
