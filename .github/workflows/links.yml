name: links
# External links break without any change on our side, so this check is not a
# required check of pull requests: it runs every Monday and on demand.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml --no-progress "docs/**/*.md" README.md CONTRIBUTING.md
          fail: true
