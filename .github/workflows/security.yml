name: security
# Secret scan of the whole history and audit of the pinned dependencies (plan step F6).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Every Monday: a vulnerability can be published without any change on our side.
    - cron: "0 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
env:
  GITLEAKS_VERSION: "8.30.1"
  # SHA-256 of gitleaks_8.30.1_linux_x64.tar.gz, from gitleaks_8.30.1_checksums.txt of the release.
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned, checksum verified)
        run: |
          curl -sSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP/gitleaks" gitleaks
          rm gitleaks.tar.gz
      - name: Scan the history of the branch
        run: '"$RUNNER_TEMP/gitleaks/gitleaks" git --config .gitleaks.toml --no-banner --redact --verbose .'
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pip-audit==2.10.1
      - name: Audit the pinned requirements
        run: |
          files=""
          for f in requirements-docs.txt requirements-dev.txt; do
            if [ -f "$f" ]; then files="$files -r $f"; fi
          done
          python -m pip_audit $files
